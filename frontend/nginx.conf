# Final config (no template processing): the Docker CMD substitutes
# __BACKEND_URL__ via sed, so plain nginx $variables need no escaping.
# Same-origin for the browser: UI assets local, /api/* proxied to Spring.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass __BACKEND_URL__/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
